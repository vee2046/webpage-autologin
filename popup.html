<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Login Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- 顶部标题栏 -->
    <header class="header">
      <div class="header-left">
        <svg class="header-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <h1>Auto Login</h1>
      </div>
      <div class="header-actions">
        <button class="btn-side-panel" id="btnSidePanel" title="新建站点配置（在当前页面打开）">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="13" x2="12" y2="19"/>
            <line x1="9" y1="16" x2="15" y2="16"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 站点列表 -->
    <div class="site-list" id="siteList">
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <p>暂无站点配置</p>
        <span>点击右上角新建图标在页面上添加</span>
      </div>
    </div>

    <!-- 底部状态栏 -->
    <footer class="footer">
      <span id="siteCount">0 个站点</span>
      <div class="footer-actions">
        <button class="btn-text" id="btnImport" title="从 JSON 文件导入站点配置">导入</button>
        <button class="btn-text" id="btnExport" title="导出站点配置为 JSON 文件">导出</button>
        <button class="btn-text" id="btnTestCurrent" title="在当前页面测试自动登录">测试当前页</button>
      </div>
    </footer>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">添加站点</h2>
        <button class="btn-close" id="btnClose">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form class="form" id="siteForm">
        <input type="hidden" id="editId">

        <div class="form-group">
          <label for="siteUrl">
            网址 <span class="required">*</span>
            <span class="hint">支持通配符 * ，如 https://*.example.com/*</span>
          </label>
          <input type="text" id="siteUrl" placeholder="https://example.com/login" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="siteUsername">
              用户名 <span class="required">*</span>
            </label>
            <input type="text" id="siteUsername" placeholder="your_username" required>
          </div>
          <div class="form-group">
            <label for="sitePassword">
              密码 <span class="required">*</span>
            </label>
            <div class="password-wrapper">
              <input type="password" id="sitePassword" placeholder="your_password" required>
              <button type="button" class="btn-eye" id="btnTogglePassword" title="显示/隐藏密码">
                <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="divider"></div>
        <p class="section-title">CSS 选择器配置</p>

        <div class="form-row">
          <div class="form-group">
            <label for="usernameSelector">
              用户名选择器 <span class="required">*</span>
            </label>
            <input type="text" id="usernameSelector" placeholder="#username" required>
          </div>
          <div class="form-group">
            <label for="passwordSelector">
              密码选择器 <span class="required">*</span>
            </label>
            <input type="text" id="passwordSelector" placeholder="input[type='password']" required>
          </div>
        </div>

        <div class="form-group">
          <label for="loginButtonSelector">
            登录按钮选择器 <span class="required">*</span>
          </label>
          <input type="text" id="loginButtonSelector" placeholder="button[type='submit']" required>
        </div>

        <div class="form-group">
          <label for="agreementSelector">
            协议勾选选择器
            <span class="hint">可选，如 #agree-checkbox</span>
          </label>
          <input type="text" id="agreementSelector" placeholder="#agree（可选）">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btnCancel">取消</button>
          <button type="submit" class="btn btn-primary" id="btnSave">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 确认删除弹窗 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-dialog">
      <p class="confirm-text" id="confirmText">确定要删除这个站点配置吗？</p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="btnConfirmCancel">取消</button>
        <button class="btn btn-danger" id="btnConfirmDelete">删除</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <!-- 隐藏的文件输入（导入用）-->
  <input type="file" id="importFileInput" accept="application/json,.json" style="display:none">

  <script src="crypto.js"></script>
<script src="popup.js"></script>
</body>
</html>
